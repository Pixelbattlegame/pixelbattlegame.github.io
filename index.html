<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Battle has moved</title>
<link rel="canonical" href="https://pixelbattlegame.com/">
<meta name="robots" content="noindex">
<script>
// Pixel Battle moved to pixelbattlegame.com. Browsers keep saved games separately for each address,
// so this page sends each player's saved progress along with them.
(function(){
  var data = {};
  try { ['prof', 'recentThemes', 'muted', 'kicked'].forEach(function(k){ var v = localStorage.getItem('pixelbattle.' + k); if (v !== null) data[k] = JSON.parse(v); }); } catch(e){}
  var to = 'https://pixelbattlegame.com/' + location.search;
  if (Object.keys(data).length){ try { to += '#pbimport=' + btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); } catch(e){} }
  location.replace(to);
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a1c2c;color:#f4f4f4;font:18px/1.5 system-ui,sans-serif;text-align:center;padding:16px}a{color:#73eff7}</style>
</head>
<body>
<p>Pixel Battle has moved to <a href="https://pixelbattlegame.com/">pixelbattlegame.com</a>.<br>Taking you there now…</p>
</body>
</html>
